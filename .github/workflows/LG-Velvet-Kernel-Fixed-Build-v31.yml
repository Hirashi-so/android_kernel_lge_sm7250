name: LG Velvet 5G - Stock + KernelSU + SUSFS

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Kernel Defconfig"
        required: true
        default: "vendor/caymanlm_defconfig"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      ARCH: arm64
      LLVM: "1"
      LLVM_IAS: "1"
      CLANG_DIR: ${{ github.workspace }}/clang-prebuilt/clang-r547379
      GCC64_DIR: ${{ github.workspace }}/gcc64
      GCC32_DIR: ${{ github.workspace }}/gcc32
      DIAG_DIR: ${{ github.workspace }}/ci-logs
      KSU_VERSION: "v0.9.5"
      SUSFS_REPO: "https://gitlab.com/simonpunk/susfs4ksu.git"
      SUSFS_BRANCH: "kernel-4.19"

    steps:

      # ============================================================
      # 01. CHECKOUT - STOCK KERNEL SOURCE
      # ============================================================
      - name: 01 - Checkout Kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 02. INITIALIZE LOGGING
      # ============================================================
      - name: 02 - Initialize Diagnostics
        shell: bash
        run: |
          set -u
          mkdir -p "$DIAG_DIR"
          {
            echo "=========================================="
            echo "STOCK + KERNELSU + SUSFS BUILD"
            echo "=========================================="
            echo "UTC=$(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "WORKSPACE=$GITHUB_WORKSPACE"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "SHA=$GITHUB_SHA"
            echo "BRANCH=$GITHUB_REF_NAME"
            echo
            echo "KERNELSU=$KSU_VERSION"
            echo "SUSFS_BRANCH=$SUSFS_BRANCH"
            echo
            git rev-parse HEAD
            git status --short
            echo
            grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' Makefile || true
            echo
            df -h
            echo
            free -h
          } > "$DIAG_DIR/02-initialize.log" 2>&1 || true

      # ============================================================
      # 03. HOST DEPENDENCIES
      # ============================================================
      - name: 03 - Install Build Dependencies
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/03-install-dependencies.log"
          : > "$LOG"
          {
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              git curl wget make gcc g++ bison flex bc cpio \
              python3 python-is-python3 gawk zip unzip rsync patch perl \
              libssl-dev libelf-dev device-tree-compiler file
            echo
            gcc --version | sed -n '1p'
            make --version | sed -n '1p'
            python3 --version
          } >"$LOG" 2>&1
          STATUS=$?
          tail -100 "$LOG" || true
          exit "$STATUS"

      # ============================================================
      # 04. ANDROID CLANG
      # Keep the existing toolchain from the previous workflow.
      # This does NOT modify the kernel source.
      # ============================================================
      - name: 04 - Download Android Clang r547379
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/04-download-clang.log"
          : > "$LOG"
          {
            rm -rf clang-prebuilt toolchain

            git clone \
              --depth=1 \
              --filter=blob:none \
              --sparse \
              --branch android16-qpr2-release \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86.git \
              clang-prebuilt

            cd clang-prebuilt
            git sparse-checkout set clang-r547379
            cd ..

            test -x "$CLANG_DIR/bin/clang"
            test -x "$CLANG_DIR/bin/ld.lld"

            ln -s "$CLANG_DIR" toolchain

            "$CLANG_DIR/bin/clang" --version
            "$CLANG_DIR/bin/ld.lld" --version
          } >"$LOG" 2>&1
          STATUS=$?
          tail -100 "$LOG" || true
          exit "$STATUS"

      # ============================================================
      # 05. GCC64
      # ============================================================
      - name: 05 - Download AArch64 GCC 4.9
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/05-download-gcc64.log"
          : > "$LOG"
          {
            rm -rf gcc64
            git clone --depth=1 \
              https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
              gcc64
            test -x gcc64/bin/aarch64-linux-android-gcc
            gcc64/bin/aarch64-linux-android-gcc --version
          } >"$LOG" 2>&1
          STATUS=$?
          tail -80 "$LOG" || true
          exit "$STATUS"

      # ============================================================
      # 06. GCC32
      # ============================================================
      - name: 06 - Download ARM32 GCC 4.9
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/06-download-gcc32.log"
          : > "$LOG"
          {
            rm -rf gcc32
            git clone --depth=1 \
              https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
              gcc32
            test -x gcc32/bin/arm-linux-androideabi-gcc
            gcc32/bin/arm-linux-androideabi-gcc --version
          } >"$LOG" 2>&1
          STATUS=$?
          tail -80 "$LOG" || true
          exit "$STATUS"

      # ============================================================
      # 07. TOOLCHAIN ENVIRONMENT
      # ============================================================
      - name: 07 - Prepare Toolchain Environment
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/07-toolchain-check.log"
          : > "$LOG"
          {
            export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"

            echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
            echo "$GCC64_DIR/bin" >> "$GITHUB_PATH"
            echo "$GCC32_DIR/bin" >> "$GITHUB_PATH"

            {
              echo "CROSS_COMPILE=$GCC64_DIR/bin/aarch64-linux-android-"
              echo "CROSS_COMPILE_ARM32=$GCC32_DIR/bin/arm-linux-androideabi-"
            } >> "$GITHUB_ENV"

            command -v clang
            clang --version | sed -n '1,2p'
            command -v ld.lld
            ld.lld --version | sed -n '1,2p'
            command -v aarch64-linux-android-gcc
            command -v arm-linux-androideabi-gcc

            printf '%s\n' 'int main(void) { return 0; }' > /tmp/test.c
            clang --target=aarch64-linux-gnu -c /tmp/test.c -o /tmp/test.o
            test -s /tmp/test.o
            echo "Toolchain host test: PASS"
          } >"$LOG" 2>&1
          STATUS=$?
          tail -120 "$LOG" || true
          exit "$STATUS"

      # ============================================================
      # 08. KERNELSU
      #
      # LG Velvet is a 4.19 non-GKI kernel. Official KernelSU
      # documentation states v0.9.5 is the last official version
      # supporting non-GKI integration.
      # ============================================================
      - name: 08 - Apply KernelSU v0.9.5
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/08-kernelsu.log"
          : > "$LOG"
          {
            curl -LSs \
              "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
              | bash -s "$KSU_VERSION"

            test -d KernelSU
            test -f drivers/kernelsu/Kconfig
            test -f drivers/kernelsu/Makefile

            echo
            echo "KernelSU commit:"
            git -C KernelSU rev-parse HEAD
            echo
            echo "KernelSU version:"
            git -C KernelSU describe --tags --always 2>/dev/null || true
          } >"$LOG" 2>&1
          STATUS=$?
          tail -120 "$LOG" || true
          exit "$STATUS"

      # ============================================================
      # 09. SUSFS - ONLY SECOND FEATURE
      # Kernel 4.19 non-GKI patch set.
      # No other feature patches are applied.
      # ============================================================
      - name: 09 - Apply SUSFS for Kernel 4.19
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/09-susfs.log"
          : > "$LOG"
          {
            rm -rf susfs4ksu

            git clone \
              --depth=1 \
              --branch "$SUSFS_BRANCH" \
              "$SUSFS_REPO" \
              susfs4ksu

            echo "SUSFS commit:"
            git -C susfs4ksu rev-parse HEAD
            echo
            echo "SUSFS branch:"
            git -C susfs4ksu branch --show-current
            echo

            test -f \
              susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

            test -f \
              susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch

            # Copy ONLY SUSFS files required by the 4.19 patch set.
            cp \
              susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch \
              KernelSU/

            cp \
              susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch \
              ./

            cp -f susfs4ksu/kernel_patches/fs/* fs/
            cp -f susfs4ksu/kernel_patches/include/linux/* include/linux/

            echo
            echo "Checking KernelSU SUSFS patch:"
            (
              cd KernelSU
              patch --dry-run -p1 < 10_enable_susfs_for_ksu.patch
            )

            echo
            echo "Checking kernel SUSFS patch:"
            patch --dry-run -p1 < 50_add_susfs_in_kernel-4.19.patch

            echo
            echo "Applying KernelSU SUSFS patch:"
            (
              cd KernelSU
              patch -p1 < 10_enable_susfs_for_ksu.patch
            )

            echo
            echo "Applying kernel SUSFS patch:"
            patch -p1 < 50_add_susfs_in_kernel-4.19.patch

            echo
            echo "SUSFS source verification:"
            test -f fs/susfs.c
            find include/linux -maxdepth 1 -type f -name 'susfs*.h' -print

            echo
            echo "SUSFS integration completed."
          } >"$LOG" 2>&1
          STATUS=$?
          tail -160 "$LOG" || true
          exit "$STATUS"

      # ============================================================
      # 10. STOCK DEFCONFIG
      # No camera/audio/WSA/baseband/security modifications.
      # ============================================================
      - name: 10 - Configure Stock Defconfig
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/10-defconfig.log"
          : > "$LOG"
          {
            export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
            export CROSS_COMPILE="$GCC64_DIR/bin/aarch64-linux-android-"
            export CROSS_COMPILE_ARM32="$GCC32_DIR/bin/arm-linux-androideabi-"

            DEFCONFIG="${{ github.event.inputs.defconfig }}"
            test -f "arch/arm64/configs/${DEFCONFIG}"

            make \
              ARCH=arm64 \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="$CROSS_COMPILE" \
              CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
              "$DEFCONFIG"

            test -s .config
          } >"$LOG" 2>&1
          STATUS=$?
          tail -120 "$LOG" || true
          exit "$STATUS"

      # ============================================================
      # 11. ONLY KERNELSU + SUSFS CONFIGURATION
      # ============================================================
      - name: 11 - Enable Only KernelSU and SUSFS
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/11-security-config.log"
          : > "$LOG"
          {
            python3 - <<'PY'
          from pathlib import Path

          p = Path(".config")
          lines = p.read_text().splitlines()

          wanted = {
              "CONFIG_KSU": "CONFIG_KSU=y",
              "CONFIG_KSU_SUSFS": "CONFIG_KSU_SUSFS=y",
              "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT": "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y",
              "CONFIG_KPROBES": "CONFIG_KPROBES=y",
              "CONFIG_KPROBE_EVENTS": "CONFIG_KPROBE_EVENTS=y",
          }

          out = []
          for line in lines:
              key = line[2:].split("=", 1)[0] if line.startswith("# ") else line.split("=", 1)[0]
              if key in wanted:
                  continue
              out.append(line)

          out.extend(wanted.values())
          p.write_text("\n".join(out) + "\n")
          PY

            make olddefconfig

            echo "Final KSU/SUSFS configuration:"
            grep -E '^CONFIG_(KSU|KSU_SUSFS|KPROBES|KPROBE_EVENTS)=' .config || true
          } >"$LOG" 2>&1
          STATUS=$?
          tail -120 "$LOG" || true
          exit "$STATUS"

      # ============================================================
      # 12. BASELINE INTEGRITY CHECK
      # Verify that no old BBG/camera/WSA modifications are being
      # intentionally injected by this workflow.
      # ============================================================
      - name: 12 - Stock Baseline Integrity Check
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/12-stock-integrity.log"
          : > "$LOG"
          {
            echo "This workflow intentionally applies only:"
            echo "  1) KernelSU"
            echo "  2) SUSFS"
            echo

            echo "Unexpected feature directories:"
            for p in \
              security/baseband-guard \
              drivers/baseband-guard \
              drivers/bbg; do
              if [ -e "$p" ]; then
                echo "[PRESENT] $p (existing source is not modified by this workflow)"
              else
                echo "[ABSENT]  $p"
              fi
            done

            echo
            echo "Relevant config:"
            grep -E '^CONFIG_(KSU|KSU_SUSFS|KPROBES|KPROBE_EVENTS|BBG)=' .config || true

            echo
            echo "Git diff excluding intentional KSU/SUSFS integration:"
            git status --short
            git diff --stat || true

            echo
            echo "Stock baseline integrity check complete."
          } >"$LOG" 2>&1
          tail -160 "$LOG" || true
          exit 0

      # ============================================================
      # 13. PRE-BUILD SANITY
      # ============================================================
      - name: 13 - Pre-Build Sanity
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/13-prebuild-sanity.log"
          : > "$LOG"
          {
            make kernelversion
            echo
            clang --version | sed -n '1,2p'
            echo
            ld.lld --version | sed -n '1,2p'
            echo
            test -s .config
            test -f drivers/kernelsu/Kconfig
            test -f fs/susfs.c
            grep -q '^CONFIG_KSU=y$' .config
            grep -q '^CONFIG_KSU_SUSFS=y$' .config
            grep -q '^CONFIG_KPROBES=y$' .config
            grep -q '^CONFIG_KPROBE_EVENTS=y$' .config
            echo
            echo "Required KernelSU/SUSFS inputs: PASS"
          } >"$LOG" 2>&1
          STATUS=$?
          tail -160 "$LOG" || true
          exit "$STATUS"

      # ============================================================
      # 14. BUILD KERNEL
      # Full V=1 output is saved to an artifact file.
      # NO source patching happens in the build step.
      # ============================================================
      - name: 14 - Build Kernel (Full Log)
        shell: bash
        run: |
          set +e

          FULL_LOG="$GITHUB_WORKSPACE/kernel-build-full.log"
          ERROR_LOG="$DIAG_DIR/14-build-errors.log"
          TAIL_LOG="$DIAG_DIR/14-build-tail.log"
          SUMMARY_LOG="$DIAG_DIR/14-build-summary.log"

          : > "$FULL_LOG"
          : > "$ERROR_LOG"
          : > "$TAIL_LOG"
          : > "$SUMMARY_LOG"

          export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
          export CROSS_COMPILE="$GCC64_DIR/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GCC32_DIR/bin/arm-linux-androideabi-"

          echo "STARTING STOCK + KERNELSU + SUSFS BUILD"
          echo "Full V=1 output -> kernel-build-full.log"

          START=$(date +%s)

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            -j"$(nproc)" \
            V=1 \
            >"$FULL_LOG" 2>&1

          BUILD_STATUS=$?

          END=$(date +%s)
          ELAPSED=$((END-START))

          {
            echo "BUILD_STATUS=$BUILD_STATUS"
            echo "BUILD_TIME_SECONDS=$ELAPSED"
            echo "BUILD_LOG_BYTES=$(wc -c < "$FULL_LOG")"
            echo "BUILD_LOG_LINES=$(wc -l < "$FULL_LOG")"
          } | tee "$SUMMARY_LOG"

          grep -nEi \
            'fatal error:|error:|undefined reference|undeclared|implicit declaration|invalid|unknown argument|unknown warning|No such file|No rule to make target|recipe for target|Error [0-9]+|make\[[0-9]+\]: \*\*\*' \
            "$FULL_LOG" \
            | tail -250 >"$ERROR_LOG" || true

          tail -300 "$FULL_LOG" >"$TAIL_LOG" || true

          echo
          echo "===== COMPACT BUILD ERROR SUMMARY ====="
          if [ -s "$ERROR_LOG" ]; then
            tail -30 "$ERROR_LOG"
          else
            echo "No compiler-error pattern found."
          fi

          echo
          echo "===== LAST 40 BUILD LINES ====="
          tail -40 "$FULL_LOG" || true

          if [ "$BUILD_STATUS" -eq 0 ]; then
            test -s arch/arm64/boot/Image
            echo "KERNEL BUILD SUCCESSFUL"
          else
            echo "KERNEL BUILD FAILED - COMPLETE LOG SAVED"
          fi

          exit "$BUILD_STATUS"

      # ============================================================
      # 15. FINAL VERIFICATION
      # ============================================================
      - name: 15 - Final Verification
        if: always()
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/15-final-verification.log"
          : > "$LOG"
          {
            echo "=========================================="
            echo "FINAL VERIFICATION"
            echo "=========================================="
            echo
            echo "Kernel version:"
            make kernelversion 2>&1 || true
            echo
            echo "KernelSU/SUSFS config:"
            grep -E '^CONFIG_(KSU|KSU_SUSFS|KPROBES|KPROBE_EVENTS)=' .config 2>&1 || true
            echo
            echo "Kernel image:"
            ls -lh arch/arm64/boot/Image 2>&1 || true
            echo
            echo "Full build log:"
            ls -lh kernel-build-full.log 2>&1 || true
          } >"$LOG" 2>&1
          cat "$LOG"
          exit 0

      # ============================================================
      # 16. DIAGNOSTIC SUMMARY
      # ============================================================
      - name: 16 - Generate Diagnostic Summary
        if: always()
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/16-diagnostic-summary.log"
          {
            echo "=========================================="
            echo "COMPLETE DIAGNOSTIC SUMMARY"
            echo "=========================================="
            echo "UTC: $(date -u)"
            echo "SHA: $GITHUB_SHA"
            echo "RUN: $GITHUB_RUN_ID"
            echo
            echo "===== LOG FILES ====="
            find "$DIAG_DIR" -type f -printf '%p %s bytes\n' | sort
            echo
            echo "===== BUILD LOG ====="
            wc -l kernel-build-full.log 2>/dev/null || true
            wc -c kernel-build-full.log 2>/dev/null || true
            echo
            echo "===== BUILD ERRORS ====="
            tail -30 "$DIAG_DIR/14-build-errors.log" 2>/dev/null || true
            echo
            echo "===== IMAGE ====="
            ls -lh arch/arm64/boot/Image 2>&1 || true
          } >"$LOG" 2>&1
          cat "$LOG"
          exit 0

      # ============================================================
      # 17. FINAL FAILURE SNAPSHOT
      # ============================================================
      - name: 17 - Final Failure Snapshot
        if: always()
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/17-final-failure-snapshot.log"
          {
            echo "UTC: $(date -u)"
            echo
            echo "Disk:"
            df -h
            echo
            echo "Memory:"
            free -h
            echo
            echo "Last build errors:"
            tail -30 "$DIAG_DIR/14-build-errors.log" 2>/dev/null || true
            echo
            echo "Last build lines:"
            tail -40 "$DIAG_DIR/14-build-tail.log" 2>/dev/null || true
          } >"$LOG" 2>&1
          cat "$LOG"
          exit 0

      # ============================================================
      # 18. PACKAGE ANYKERNEL3
      # ============================================================
      - name: 18 - Package AnyKernel3
        if: success()
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/18-package-anykernel.log"
          : > "$LOG"
          {
            test -s arch/arm64/boot/Image

            rm -rf AnyKernel3
            git clone --depth=1 \
              https://github.com/osm0sis/AnyKernel3.git \
              AnyKernel3

            cp arch/arm64/boot/Image AnyKernel3/
            cd AnyKernel3
            rm -rf .git

            zip -r9 \
              ../LG-Velvet-Stock-KernelSU-SUSFS.zip \
              . \
              -x "*.git*" \
              -x "README.md"

            cd ..
            mkdir -p output
            mv LG-Velvet-Stock-KernelSU-SUSFS.zip output/

            ls -lh output/
          } >"$LOG" 2>&1
          STATUS=$?
          tail -120 "$LOG" || true
          exit "$STATUS"

      # ============================================================
      # 19. STAGE COMPLETE DIAGNOSTICS
      # ============================================================
      - name: 19 - Stage Complete Diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf diagnostic-artifact
          mkdir -p diagnostic-artifact

          cp -f kernel-build-full.log diagnostic-artifact/14-build-full.log 2>/dev/null || true
          cp -f .config diagnostic-artifact/final.config 2>/dev/null || true
          cp -rf "$DIAG_DIR" diagnostic-artifact/ci-logs 2>/dev/null || true

          {
            echo "GitHub Run: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Date: $(date -u)"
            echo
            find diagnostic-artifact -type f -printf '%p %s bytes\n' | sort
          } > diagnostic-artifact/MANIFEST.txt

          exit 0

      # ============================================================
      # 20. UPLOAD COMPLETE DIAGNOSTICS
      # ============================================================
      - name: 20 - Upload Complete Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LG-Velvet-Stock-KSU-SUSFS-Diagnostics
          path: diagnostic-artifact
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      # ============================================================
      # 21. UPLOAD KERNEL IMAGE
      # ============================================================
      - name: 21 - Upload Kernel Output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LG-Velvet-Stock-KSU-SUSFS-Image
          path: arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 22. UPLOAD FLASHABLE ZIP
      # ============================================================
      - name: 22 - Upload Flashable ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LG-Velvet-Stock-KSU-SUSFS
          path: output/LG-Velvet-Stock-KernelSU-SUSFS.zip
          if-no-files-found: error
          retention-days: 14
