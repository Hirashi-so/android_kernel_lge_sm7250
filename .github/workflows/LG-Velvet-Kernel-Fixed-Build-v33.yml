      # These old 4.19 trace headers use: TRACE_INCLUDE_PATH .
      # Modern Clang does not reliably resolve that macro-expanded relative
      # include unless the header's source directory is explicitly on -I.
      # Do NOT delete/disable the trace header or the driver. Add the proper
      # source-directory include path to that directory's Kbuild flags.
      # This is limited to directories that actually contain TRACE_INCLUDE_PATH .
      # ============================================================
      - name: 17B - Fix Local Trace Header Include Paths
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/17b-fix-trace-include-paths.log"
          : > "$LOG"

          {
            echo "=========================================="
            echo "TRACE HEADER INCLUDE PATH COMPATIBILITY"
            echo "=========================================="

            FAIL=0
            FOUND=0

            while IFS= read -r -d '' f; do
              if grep -qE '^[[:space:]]*#define[[:space:]]+TRACE_INCLUDE_PATH[[:space:]]+\.$' "$f"; then
                FOUND=$((FOUND + 1))
                dir="${f%/*}"
                makefile="$dir/Makefile"
                rel="$dir"

                echo
                echo "TRACE HEADER: $f"
                echo "SOURCE DIR:   $dir"
                echo "MAKEFILE:     $makefile"

                if [ ! -f "$makefile" ]; then
                  echo "[WARN] No Makefile in $dir; applying build-wide KCFLAGS fallback is unsafe here."
                  continue
                fi

                flag="-I\$(srctree)/$rel"
                if grep -Fqx "ccflags-y += $flag" "$makefile"; then
                  echo "[PASS] Include flag already present: $flag"
                else
                  printf '\n# CI compatibility: allow Clang to resolve TRACE_INCLUDE_PATH .\nccflags-y += %s\n' "$flag" >> "$makefile"
                  echo "[FIXED] Added: ccflags-y += $flag"
                fi

                grep -nF "ccflags-y += $flag" "$makefile" || true
              fi
            done < <(find . -type f \
              \( -name 'trace.h' -o -name '*_trace.h' -o -name 'trace_*.h' \) \
              -print0)

            echo
            echo "Trace headers requiring explicit source include paths: $FOUND"

            echo
            echo "Verify qcom trace path:"
            test -s drivers/clk/qcom/trace.h
            grep -nE 'TRACE_INCLUDE_PATH|TRACE_INCLUDE_FILE' drivers/clk/qcom/trace.h
            grep -nF 'ccflags-y += -I\$(srctree)/drivers/clk/qcom' drivers/clk/qcom/Makefile

            echo
            echo "Git diff for trace include compatibility:"
