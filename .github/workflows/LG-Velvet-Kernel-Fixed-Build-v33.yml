name: LG Velvet 5G - KernelSU Next + Baseband Guard - Fixed Build v33

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Kernel Defconfig"
        required: true
        default: "vendor/caymanlm_defconfig"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      ARCH: arm64
      LLVM: "1"
      LLVM_IAS: "1"
      CLANG_DIR: ${{ github.workspace }}/clang-prebuilt/clang-r547379
      GCC64_DIR: ${{ github.workspace }}/gcc64
      GCC32_DIR: ${{ github.workspace }}/gcc32
      DIAG_DIR: ${{ github.workspace }}/ci-logs

    steps:

      # ============================================================
      # 01. CHECKOUT
      # ============================================================
      - name: 01 - Checkout Kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 02. DIAGNOSTIC DIRECTORY
      # ============================================================
      - name: 02 - Initialize Diagnostics
        shell: bash
        run: |
          set -u
          mkdir -p "$DIAG_DIR"
          {
            echo "WORKSPACE=$GITHUB_WORKSPACE"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "SHA=$GITHUB_SHA"
            echo "BRANCH=$GITHUB_REF_NAME"
            echo "DATE=$(date -u)"
            echo
            df -h
            echo
            free -h
            echo
            git rev-parse HEAD
            git status --short
          } > "$DIAG_DIR/02-initialize.log" 2>&1 || true

      # ============================================================
      # 03. DEPENDENCIES
      # IMPORTANT: never pipe make --version into head.
      # That was the source of "make: write error: stdout".
      # ============================================================
      - name: 03 - Install Build Dependencies
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/03-install-dependencies.log"
          : > "$LOG"

          {
            echo "=========================================="
            echo "HOST DEPENDENCIES"
            echo "=========================================="

            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              git curl wget make gcc g++ bison flex bc cpio \
              python3 python-is-python3 gawk zip unzip rsync patch perl \
              libssl-dev libelf-dev device-tree-compiler file

            echo
            echo "gcc:"
            gcc --version > /tmp/gcc-version.txt 2>&1
            sed -n '1p' /tmp/gcc-version.txt

            echo
            echo "make:"
            make --version > /tmp/make-version.txt 2>&1
            sed -n '1p' /tmp/make-version.txt

            echo
            echo "python:"
            python3 --version

            echo
            echo "Host dependency installation completed."
          } >"$LOG" 2>&1
          STATUS=$?

          echo "---- dependency log tail ----"
          tail -80 "$LOG" || true
          exit "$STATUS"

      # ============================================================
      # 04. ANDROID CLANG
      # ============================================================
      - name: 04 - Download Android Clang r547379
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/04-download-clang.log"
          : > "$LOG"

          {
            rm -rf clang-prebuilt toolchain

            git clone \
              --depth=1 \
              --filter=blob:none \
              --sparse \
              --branch android16-qpr2-release \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86.git \
              clang-prebuilt

            cd clang-prebuilt
            git sparse-checkout set clang-r547379
            cd ..

            test -x clang-prebuilt/clang-r547379/bin/clang
            test -x clang-prebuilt/clang-r547379/bin/ld.lld

            ln -s "$CLANG_DIR" toolchain

            "$CLANG_DIR/bin/clang" --version
            "$CLANG_DIR/bin/ld.lld" --version
          } >"$LOG" 2>&1
          STATUS=$?

          tail -80 "$LOG" || true
          exit "$STATUS"

      # ============================================================
      # 05. GCC64
      # ============================================================
      - name: 05 - Download AArch64 GCC 4.9
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/05-download-gcc64.log"
          : > "$LOG"

          {
            rm -rf gcc64
            git clone --depth=1 \
              https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
              gcc64
            test -x gcc64/bin/aarch64-linux-android-gcc
            gcc64/bin/aarch64-linux-android-gcc --version
          } >"$LOG" 2>&1
          STATUS=$?

          tail -60 "$LOG" || true
          exit "$STATUS"

      # ============================================================
      # 06. GCC32
      # ============================================================
      - name: 06 - Download ARM32 GCC 4.9
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/06-download-gcc32.log"
          : > "$LOG"

          {
            rm -rf gcc32
            git clone --depth=1 \
              https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
              gcc32
            test -x gcc32/bin/arm-linux-androideabi-gcc
            gcc32/bin/arm-linux-androideabi-gcc --version
          } >"$LOG" 2>&1
          STATUS=$?

          tail -60 "$LOG" || true
          exit "$STATUS"

      # ============================================================
      # 07. TOOLCHAIN CHECK
      # ============================================================
      - name: 07 - Prepare Toolchain Environment
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/07-toolchain-check.log"
          : > "$LOG"

          {
            export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
            export CROSS_COMPILE="$GCC64_DIR/bin/aarch64-linux-android-"
            export CROSS_COMPILE_ARM32="$GCC32_DIR/bin/arm-linux-androideabi-"

            # Persist toolchain paths for every later GitHub Actions step.
            echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
            echo "$GCC64_DIR/bin" >> "$GITHUB_PATH"
            echo "$GCC32_DIR/bin" >> "$GITHUB_PATH"
            {
              echo "CROSS_COMPILE=$GCC64_DIR/bin/aarch64-linux-android-"
              echo "CROSS_COMPILE_ARM32=$GCC32_DIR/bin/arm-linux-androideabi-"
            } >> "$GITHUB_ENV"

            command -v clang
            clang --version

            command -v ld.lld
            ld.lld --version

            command -v llvm-ar
            command -v llvm-nm

            command -v aarch64-linux-android-gcc
            command -v arm-linux-androideabi-gcc

            printf '%s\n' 'int main(void) { return 0; }' > /tmp/test.c

            clang --target=aarch64-linux-gnu -c /tmp/test.c -o /tmp/test.o
            test -s /tmp/test.o

            echo "AArch64 Clang host test: PASS"
          } >"$LOG" 2>&1
          STATUS=$?

          tail -100 "$LOG" || true
          exit "$STATUS"

      # ============================================================
      # 08. KERNELSU NEXT
      # ============================================================
      - name: 08 - Apply KernelSU Next Legacy
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/08-kernelsu-next.log"
          : > "$LOG"

          {
            curl -LSs \
              "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
              | bash -s legacy

            echo "KernelSU-Next setup completed."
          } >"$LOG" 2>&1
          STATUS=$?

          tail -100 "$LOG" || true
          exit "$STATUS"

      # ============================================================
      # 09. BASEBAND GUARD
      # ============================================================
      - name: 09 - Apply Baseband Guard v1.1
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/09-baseband-guard.log"
          : > "$LOG"

          {
            curl -LSs \
              "https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/v1.1/setup.sh" \
              -o /tmp/baseband-guard-setup.sh

            chmod +x /tmp/baseband-guard-setup.sh
            /tmp/baseband-guard-setup.sh v1.1

            test -f security/baseband-guard/baseband_guard.c
            test -f security/baseband-guard/Makefile
            test -f security/baseband-guard/kernel_compat.h
          } >"$LOG" 2>&1
          STATUS=$?

          tail -100 "$LOG" || true
          exit "$STATUS"

      # ============================================================
      # 10. KNOWN 4.19 + MODERN CLANG FIXES
      # ============================================================
      - name: 10 - Apply Known Clang 4.19 Compatibility Fixes
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/10-source-compatibility-fixes.log"
          : > "$LOG"

          {
            python3 - <<'PY'
          from pathlib import Path

          # fault-inject.c: modern Clang rejects the old WRITE_ONCE
          # expression form. Keep the decrement explicit.
          p = Path("lib/fault-inject.c")
          if p.exists():
              s = p.read_text()
              old = "if (!WRITE_ONCE(current->fail_nth, fail_nth - 1))"
              if old in s:
                  s = s.replace(
                      old,
                      "fail_nth--;\n\t\tWRITE_ONCE(current->fail_nth, fail_nth);\n\t\tif (!fail_nth)"
                  )
              p.write_text(s)

          # LG NFC: make the function signature explicit if the old
          # declaration is missing its parameter list.
          p = Path("drivers/nfc/lge/lgenfc.c")
          if p.exists():
              s = p.read_text()
              s = s.replace(
                  "enum NfcChip getChipset()",
                  "enum NfcChip getChipset(void)"
              )
              p.write_text(s)

          # Qualcomm camera: ensure the local directory is searched.
          p = Path("techpack/camera/drivers/cam_req_mgr/Makefile")
          if p.exists():
              s = p.read_text()
              line = "ccflags-y += -I$(srctree)/techpack/camera/drivers/cam_req_mgr"
              if line not in s:
                  s = line + "\n" + s
              p.write_text(s)
          PY

            echo "Compatibility fix verification:"
            grep -n "fail_nth" lib/fault-inject.c || true
            grep -n "getChipset" drivers/nfc/lge/lgenfc.c || true
            grep -n "techpack/camera/drivers/cam_req_mgr" \
              techpack/camera/drivers/cam_req_mgr/Makefile || true
          } >"$LOG" 2>&1
          STATUS=$?

          tail -100 "$LOG" || true
          exit "$STATUS"

      # ============================================================
      # 11. BASEBAND GUARD SELINUX INCLUDE FIX
      # ============================================================
      - name: 11 - Fix Baseband Guard SELinux Include and Dependency
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/11-baseband-selinux-include-fix.log"
          : > "$LOG"

          {
            python3 - <<'PY'
          from pathlib import Path

          p = Path("security/baseband-guard/Makefile")
          if not p.exists():
              raise SystemExit("Baseband Guard Makefile not found")

          s = p.read_text()
          lines = s.splitlines()

          required = [
              "ccflags-y += -I$(srctree)/security/selinux -I$(srctree)/security/selinux/include",
              "ccflags-y += -I$(objtree)/security/selinux -include $(srctree)/include/uapi/asm-generic/errno.h",
          ]

          out = []
          for line in lines:
              if line not in required:
                  out.append(line)

          out = required + out

          dep = "$(obj)/baseband_guard.o: $(objtree)/security/selinux/flask.h $(objtree)/security/selinux/av_permissions.h"
          out = [x for x in out if not x.startswith("$(obj)/baseband_guard.o:")]
          out.append(dep)

          p.write_text("\n".join(out) + "\n")
          PY

            cat security/baseband-guard/Makefile
          } >"$LOG" 2>&1
          STATUS=$?

          tail -120 "$LOG" || true
          exit "$STATUS"

      # ============================================================
      # 12. DEFCONFIG
      # ============================================================
      - name: 12 - Configure Defconfig
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/12-defconfig.log"
          : > "$LOG"

          {
            export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
            export CROSS_COMPILE="$GCC64_DIR/bin/aarch64-linux-android-"
            export CROSS_COMPILE_ARM32="$GCC32_DIR/bin/arm-linux-androideabi-"

            DEFCONFIG="${{ github.event.inputs.defconfig }}"
            test -f "arch/arm64/configs/${DEFCONFIG}"

            make \
              ARCH=arm64 \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="$CROSS_COMPILE" \
              CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
              "$DEFCONFIG"

            test -s .config
          } >"$LOG" 2>&1
          STATUS=$?

          tail -120 "$LOG" || true
          exit "$STATUS"

      # ============================================================
      # 13. KERNELSU + BBG CONFIGURATION
      # ============================================================
      - name: 13 - Configure KernelSU and Baseband Guard
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/13-security-config.log"
          : > "$LOG"

          {
            python3 - <<'PY'
          from pathlib import Path

          p = Path(".config")
          lines = p.read_text().splitlines()

          keys = {
              "CONFIG_KPROBES": "CONFIG_KPROBES=y",
              "CONFIG_KPROBE_EVENTS": "CONFIG_KPROBE_EVENTS=y",
              "CONFIG_KSU_KPROBE_HOOKS": "CONFIG_KSU_KPROBE_HOOKS=y",
              "CONFIG_KSU": "CONFIG_KSU=y",
              "CONFIG_SECURITY": "CONFIG_SECURITY=y",
              "CONFIG_SECURITY_SELINUX": "CONFIG_SECURITY_SELINUX=y",
              "CONFIG_BBG": "CONFIG_BBG=y",
          }

          out = []
          for line in lines:
              remove = False
              for key in keys:
                  if line.startswith(key + "=") or line.startswith("# " + key + " is not set"):
                      remove = True
                      break
              if not remove and not line.startswith("CONFIG_LSM="):
                  out.append(line)

          out.extend(keys.values())
          out.append(
              'CONFIG_LSM="lockdown,yama,loadpin,safesetid,integrity,selinux,smack,tomoyo,apparmor,bpf,baseband_guard"'
          )

          p.write_text("\n".join(out) + "\n")
          PY

            make olddefconfig

            grep '^CONFIG_KSU=' .config
            grep '^CONFIG_KPROBES=' .config
            grep '^CONFIG_KPROBE_EVENTS=' .config
            grep '^CONFIG_KSU_KPROBE_HOOKS=' .config
            grep '^CONFIG_SECURITY=' .config
            grep '^CONFIG_SECURITY_SELINUX=' .config
            grep '^CONFIG_BBG=' .config
            grep '^CONFIG_LSM=' .config
          } >"$LOG" 2>&1
          STATUS=$?

          tail -120 "$LOG" || true
          exit "$STATUS"

      # ============================================================
      # 14. SELINUX CAPABILITY CLASSMAP
      # ============================================================
      - name: 14 - Synchronize SELinux Capability Classmap
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/14-capability-classmap.log"
          : > "$LOG"

          {
            python3 - <<'PY'
          from pathlib import Path
          import re

          cap = Path("include/uapi/linux/capability.h").read_text()
          cm = Path("security/selinux/include/classmap.h")
          s = cm.read_text()

          caps = {}
          for m in re.finditer(
              r'(?m)^[ \t]*#define[ \t]+(CAP_[A-Z0-9_]+)[ \t]+([0-9]+)[ \t]*$',
              cap
          ):
              caps[m.group(1)] = int(m.group(2))

          last = re.search(
              r'(?m)^[ \t]*#define[ \t]+CAP_LAST_CAP[ \t]+(CAP_[A-Z0-9_]+|[0-9]+)[ \t]*$',
              cap
          )
          if not last:
              raise SystemExit("CAP_LAST_CAP not found")

          value = last.group(1)
          if value.isdigit():
              last_num = int(value)
              last_name = next(k for k,v in caps.items() if v == last_num)
          else:
              last_name = value
              last_num = caps[last_name]

          cap2 = sorted((n,k) for k,n in caps.items() if 32 <= n <= last_num)
          perms = [name[4:].lower() for _,name in cap2]

          # Keep the classmap host-safe: kernel-only capability/socket
          # checks must not be parsed by the host SELinux generator.
          start = s.find("#define COMMON_CAP2_PERMS")
          if start >= 0:
              end = s.find("\n\n", start)
              if end < 0:
                  end = len(s)
              macro = "#define COMMON_CAP2_PERMS " + ", ".join(
                  '"' + x + '"' for x in perms
              )
              s = s[:start] + macro + s[end:]

          # Guard the capability/socket kernel checks for host programs.
          if "#ifdef __KERNEL__ /* host-build guard */" not in s:
              s = re.sub(
                  r'(?ms)^#include <linux/capability\.h>\s*'
                  r'#include <linux/socket\.h>\s*'
                  r'(#if CAP_LAST_CAP.*?#endif)',
                  r'#ifdef __KERNEL__ /* host-build guard */\n'
                  r'#include <linux/capability.h>\n'
                  r'#include <linux/socket.h>\n'
                  r'\1\n#endif',
                  s,
                  count=1
              )

          cm.write_text(s)

          print(f"CAP_LAST_CAP={last_num} ({last_name})")
          print("CAP2 permissions:", ", ".join(perms))
          PY

            grep -n -A8 -B2 "COMMON_CAP2_PERMS" \
              security/selinux/include/classmap.h || true
          } >"$LOG" 2>&1
          STATUS=$?

          tail -120 "$LOG" || true
          exit "$STATUS"

      # ============================================================
      # 15. GENERATE SELINUX HEADERS - HOST SAFE
      # This is the fix for the old flask.h / host GCC failure.
      # ============================================================
      - name: 15 - Generate SELinux Headers
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/15-generate-selinux-headers.log"
          : > "$LOG"

          {
            GEN_SRC="scripts/selinux/genheaders/genheaders.c"
            GEN_BIN="scripts/selinux/genheaders/genheaders"
            CLASSMAP="security/selinux/include/classmap.h"
            SIDMAP="security/selinux/include/initial_sid_to_string.h"

            test -f "$GEN_SRC"
            test -f "$CLASSMAP"
            test -f "$SIDMAP"

            # Host-safe classmap: do not include kernel-only headers/checks
            # while compiling the generator as an x86_64 host program.
            python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("security/selinux/include/classmap.h")
          s = p.read_text()

          # If the old 4.19 form is present, guard the kernel-only
          # capability/socket section exactly like modern upstream.
          if "#include <linux/capability.h>" in s and \
             "#ifdef __KERNEL__ /* host-build guard */" not in s:
              pattern = re.compile(
                  r'(?ms)(#include <linux/capability\.h>\s*'
                  r'#include <linux/socket\.h>\s*'
                  r'#if CAP_LAST_CAP.*?#endif)'
              )
              m = pattern.search(s)
              if m:
                  block = m.group(1)
                  s = s[:m.start()] + \
                      "#ifdef __KERNEL__ /* host-build guard */\n" + \
                      block + "\n#endif" + \
                      s[m.end():]

          p.write_text(s)

          # initial_sid_to_string.h from this old tree can pull
          # asm/linkage.h while building a host program. Remove only
          # the kernel-only include; the generator only needs the table.
          p = Path("security/selinux/include/initial_sid_to_string.h")
          s = p.read_text()
          s = re.sub(
              r'(?m)^[ \t]*#include[ \t]+<linux/stddef\.h>[ \t]*\n',
              "",
              s
          )
          s = re.sub(
              r'(?m)^[ \t]*#include[ \t]+<asm/linkage\.h>[ \t]*\n',
              "",
              s
          )
          p.write_text(s)

          # Old generator sources sometimes include compiler/kernel
          # headers indirectly. Keep the source itself host-clean.
          p = Path("scripts/selinux/genheaders/genheaders.c")
          s = p.read_text()
          s = s.replace(
              "initial_sid_to_string[i] = stoupperx(initial_sid_to_string[i]);",
              """{
                  const char *sid = initial_sid_to_string[i];
                  if (sid)
                      initial_sid_to_string[i] = stoupperx(sid);
              }"""
          )
          p.write_text(s)
          PY

            rm -f security/selinux/flask.h
            rm -f security/selinux/av_permissions.h
            rm -f "$GEN_BIN"

            # HOST executable. Deliberately use Ubuntu host GCC.
            gcc \
              -Wall \
              -Wmissing-prototypes \
              -Wstrict-prototypes \
              -O2 \
              -fomit-frame-pointer \
              -std=gnu89 \
              -I./include/uapi \
              -I./include \
              -I./security/selinux/include \
              "$GEN_SRC" \
              -o "$GEN_BIN"

            chmod +x "$GEN_BIN"
            file "$GEN_BIN"

            "$GEN_BIN" \
              security/selinux/flask.h \
              security/selinux/av_permissions.h

            test -s security/selinux/flask.h
            test -s security/selinux/av_permissions.h

            grep -q '^#define SECCLASS_' security/selinux/flask.h
            grep -q '^#define ' security/selinux/av_permissions.h

            ls -lh \
              security/selinux/flask.h \
              security/selinux/av_permissions.h

            echo "SELinux generated headers: PASS"
          } >"$LOG" 2>&1
          STATUS=$?

          tail -160 "$LOG" || true
          exit "$STATUS"

      # ============================================================
      # 16. VERIFY BBG SELINUX INPUTS
      # ============================================================
      - name: 16 - Verify Baseband Guard SELinux Build Inputs
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/16-verify-bbg-selinux-inputs.log"
          : > "$LOG"

          {
            test -s security/selinux/flask.h
            test -s security/selinux/av_permissions.h
            test -f security/selinux/include/objsec.h
            test -f security/baseband-guard/baseband_guard.c

            grep -n "security/selinux" security/baseband-guard/Makefile
            grep -n "flask.h" security/baseband-guard/Makefile
            grep -n "av_permissions.h" security/baseband-guard/Makefile

            echo "BBG SELinux inputs: PASS"
          } >"$LOG" 2>&1
          STATUS=$?

          tail -100 "$LOG" || true
          exit "$STATUS"

      # ============================================================
      # 17A. RESTORE MISSING TRACKED KERNEL HEADERS
      #
      # The complete diagnostics showed four headers that are tracked
      # by the exact checked-out commit but were missing at compile time.
      # Do not disable those subsystems. Restore only a file that is
      # actually missing; never overwrite an existing modified file.
      # ============================================================
      - name: 17A - Restore Missing Tracked Kernel Headers
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/17a-restore-missing-headers.log"
          : > "$LOG"

          {
            echo "=========================================="
            echo "TRACKED HEADER INTEGRITY CHECK"
            echo "=========================================="

            FILES=(
              "drivers/clk/qcom/trace.h"
              "techpack/display/pll/pll_trace.h"
              "techpack/camera/drivers/cam_sensor_module/cam_actuator/cam_actuator_core.h"
              "techpack/display/msm/lge/lge_dsi_panel_def.h"
            )

            FAIL=0

            for f in "${FILES[@]}"; do
              echo
              echo "FILE: $f"

              if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
                echo "Tracked: YES"
              else
                echo "Tracked: NO"
                FAIL=1
                continue
              fi

              if [ -s "$f" ]; then
                echo "Present: YES"
              else
                echo "Present: NO -> restoring from HEAD"
                git restore --source=HEAD -- "$f"
                S=$?
                if [ "$S" -ne 0 ] || [ ! -s "$f" ]; then
                  echo "RESTORE FAILED"
                  FAIL=1
                else
                  echo "RESTORE: PASS"
                fi
              fi

              if [ -s "$f" ]; then
                sha256sum "$f"
              fi
            done

            echo
            echo "Final required-header check:"
            for f in "${FILES[@]}"; do
              if [ -s "$f" ]; then
                echo "[PASS] $f"
              else
                echo "[FAIL] $f"
                FAIL=1
              fi
            done

            echo
            echo "Git status:"
            git status --short

            exit "$FAIL"
          } >"$LOG" 2>&1
          STATUS=$?

          cat "$LOG"
          exit "$STATUS"

      # ============================================================
      # 17B. FIX LOCAL TRACE HEADER INCLUDE PATHS
      #
      # The previous build proved that drivers/clk/qcom/trace.h is present
      # and tracked, but Clang 20 still failed in include/trace/define_trace.h
      # with: fatal error: './trace.h' file not found.
