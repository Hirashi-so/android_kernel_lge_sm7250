          from pathlib import Path
          import re
          
          LPI = Path("arch/arm64/boot/dts/vendor/qcom/lito-lpi.dtsi")
          PINCTRL = Path("arch/arm64/boot/dts/vendor/qcom/lito-pinctrl.dtsi")
          AUDIO = Path("arch/arm64/boot/dts/vendor/qcom/lito-audio-overlay.dtsi")
          
          def uncomment_wrapper_around(text, label, max_back=2500):
              """Remove only a Disable-WSA C comment that actually encloses label."""
              pos = text.find(label)
              if pos < 0:
                  return text, False
          
              window_start = max(0, pos - max_back)
              before = text[window_start:pos]
              open_pos = before.rfind("/* Disable WSA speaker amp")
              close_pos = before.rfind("*/")
          
              if open_pos < 0 or close_pos > open_pos:
                  return text, False
          
              open_abs = window_start + open_pos
              close_abs = text.find("*/", pos)
              if close_abs < 0:
                  raise SystemExit(f"WSA wrapper is not closed for {label}")
          
              opening_end = open_abs + len("/* Disable WSA speaker amp")
              while opening_end < len(text) and text[opening_end] in (chr(10), chr(13)):
                  opening_end += 1
          
              new = text[:open_abs] + text[opening_end:close_abs] + text[close_abs + 2:]
              return new, True
          
          def uncommented_text(text):
              """Replace C/C++ comments with spaces so verification sees active labels only."""
              out = list(text)
              i = 0
              n = len(text)
              while i < n:
                  if text.startswith("//", i):
                      j = text.find(chr(10), i + 2)
                      if j < 0:
                          j = n
                      for k in range(i, j):
                          if out[k] != chr(10):
                              out[k] = " "
                      i = j
                  elif text.startswith("/*", i):
                      j = text.find("*/", i + 2)
                      if j < 0:
                          raise SystemExit("Unterminated C comment found during verification")
                      j += 2
                      for k in range(i, j):
                          if out[k] != chr(10):
                              out[k] = " "
                      i = j
                  else:
                      i += 1
              return "".join(out)
          
          def ensure_active(path, labels):
              text = path.read_text()
              for label in labels:
                  text, _ = uncomment_wrapper_around(text, label)
              path.write_text(text)
          
          ensure_active(LPI, [
              "wsa_swr_clk_active: wsa_swr_clk_active",
              "wsa_swr_data_active: wsa_swr_data_active",
          ])
          
          ensure_active(PINCTRL, [
              "spkr_1_sd_n_active: spkr_1_sd_n_active",
              "spkr_2_sd_n_active: spkr_2_sd_n_active",
          ])
          
          audio = AUDIO.read_text()
          audio_labels = [
              "wsa_macro: wsa-macro@3240000",
              "wsa_swr_gpios: wsa_swr_clk_data_pinctrl",
              "wsa_spkr_en1: wsa_spkr_en1_pinctrl",
              "wsa_spkr_en2: wsa_spkr_en2_pinctrl",
          ]
          for label in audio_labels:
              if label not in audio:
                  raise SystemExit(f"Required audio label is missing: {label}")
          
          # v32 guessed a closing label after the wrapper. That failed because the
          # wrapper had already closed. v33 removes the wrapper that actually encloses
          # each target label instead.
          for label in audio_labels:
              audio, _ = uncomment_wrapper_around(audio, label)
          
          audio = audio.replace("qcom,num-macros = <3>;", "qcom,num-macros = <4>;", 1)
          
          audio = re.sub(
              r'/\*\s*qcom,wsa-max-devs\s*=\s*<2>;\s*Disble WSA Speaker amp\s*\*/\s*qcom,wsa-max-devs\s*=\s*<0>;',
              'qcom,wsa-max-devs = <2>;',
              audio,
              count=1,
              flags=re.S,
          )
          audio = re.sub(
              r'/\*\s*qcom,wsa-devs\s*=\s*<&wsa881x_0211>,\s*<&wsa881x_0212>,\s*<&wsa881x_0213>,\s*<&wsa881x_0214>;\s*\*/',
              'qcom,wsa-devs = <&wsa881x_0211>, <&wsa881x_0212>, <&wsa881x_0213>, <&wsa881x_0214>;',
              audio,
              count=1,
              flags=re.S,
          )
          AUDIO.write_text(audio)
          
          checks = [
              ("LPI", LPI, [
                  "wsa_swr_clk_active:", "wsa_swr_clk_sleep:",
                  "wsa_swr_data_active:", "wsa_swr_data_sleep:",
              ]),
              ("PINCTRL", PINCTRL, [
                  "spkr_1_sd_n_active:", "spkr_1_sd_n_sleep:",
                  "spkr_2_sd_n_active:", "spkr_2_sd_n_sleep:",
              ]),
              ("AUDIO", AUDIO, [
                  "wsa_macro: wsa-macro@3240000",
                  "wsa_swr_gpios: wsa_swr_clk_data_pinctrl",
                  "wsa_spkr_en1: wsa_spkr_en1_pinctrl",
                  "wsa_spkr_en2: wsa_spkr_en2_pinctrl",
                  "wsa881x_0211:", "wsa881x_0212:",
                  "wsa881x_0213:", "wsa881x_0214:",
              ]),
          ]
          
          for name, path, labels in checks:
              active = uncommented_text(path.read_text())
              print(f"\n{name}:")
              for label in labels:
                  count = active.count(label)
                  print(f"  {label} = {count}")
                  if count != 1:
                      raise SystemExit(f"Expected exactly one active definition: {label}")
          
          active_audio = uncommented_text(AUDIO.read_text())
          if "qcom,num-macros = <3>;" in active_audio:
              raise SystemExit("WSA audio overlay still has num-macros=<3>")
          if "qcom,wsa-max-devs = <0>;" in active_audio:
              raise SystemExit("WSA sound card still has wsa-max-devs=<0>")
          
          print("\n17J source restoration: PASS")
          PY
          
            echo
            echo "=========================================="
            echo "LITO-CDP DTC PREFLIGHT"
            echo "=========================================="
          
            export ARCH=arm64
            export PATH="$(pwd)/toolchain/bin:$(pwd)/gcc64/bin:$(pwd)/gcc32/bin:${PATH}"
            export LLVM=1
            export LLVM_IAS=1
            export CROSS_COMPILE="$(pwd)/gcc64/bin/aarch64-linux-android-"
            export CROSS_COMPILE_ARM32="$(pwd)/gcc32/bin/arm-linux-androideabi-"
          
            rm -f arch/arm64/boot/dts/vendor/qcom/lito-cdp.dtb
          
            set +e
            make \
              ARCH=arm64 \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="${CROSS_COMPILE}" \
              CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
              arch/arm64/boot/dts/vendor/qcom/lito-cdp.dtb \
              V=1 \
              2>&1 | tee "$DIAG_DIR/17j-lito-cdp-dtc-preflight.log"
            STATUS=${PIPESTATUS[0]}
            set -e
          
            if [ "$STATUS" -ne 0 ] || [ ! -s arch/arm64/boot/dts/vendor/qcom/lito-cdp.dtb ]; then
              echo
              echo "17J RESULT: FAIL"
              exit 1
            fi
          
            echo
            echo "17J RESULT: PASS"
          
          } >"$LOG" 2>&1
          
          cat "$LOG"

      # 17K. LITOMAGNUS DT REGISTRATION AUDIT (DIAGNOSTIC ONLY)
      #
      # IMPORTANT:
      # The previous workflow incorrectly made this a hard preflight
      # gate. On the LG configuration, Kbuild's registered DT targets
      # depend on CONFIG_BUILD_ARM64_DT_OVERLAY + CONFIG_MACH_LGE.
      # A missing standalone litomagnus target here does NOT prove that
      # the kernel itself cannot build.
      #
      # This step now audits the actual Kbuild registration and NEVER
      # blocks the real kernel build.
      # ============================================================
      - name: 17K - Litomagnus DT Registration Audit (Diagnostic Only)
        if: always()
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/17k-litomagnus-dt-audit.log"
          : > "$LOG"

          {
            echo "=========================================="
            echo "LITOMAGNUS DT REGISTRATION AUDIT"
            echo "DIAGNOSTIC ONLY - NEVER A BUILD GATE"
            echo "=========================================="

            DTS_DIR="arch/arm64/boot/dts"
            QCOM_DIR="$DTS_DIR/vendor/qcom"
            QCOM_MAKEFILE="$QCOM_DIR/Makefile"

            echo "Kernel config:"
            grep -E '^CONFIG_(ARCH_LITO|MACH_LGE|BUILD_ARM64_DT_OVERLAY)=' .config 2>/dev/null || true
            echo

            echo "Source files:"
            for f in \
              "$QCOM_DIR/litomagnus.dtsi" \
              "$QCOM_DIR/litomagnus-mtp.dtsi" \
              "$QCOM_DIR/litomagnus-mtp.dts" \
              "$QCOM_DIR/litomagnus-mtp-overlay.dts"; do
              if [ -f "$f" ]; then
                echo "[PRESENT] $f"
              else
                echo "[MISSING] $f"
              fi
            done

            echo
            echo "Relevant Kbuild Makefile lines:"
            if [ -f "$QCOM_MAKEFILE" ]; then
              grep -nE \
                'CONFIG_BUILD_ARM64_DT_OVERLAY|CONFIG_MACH_LGE|litomagnus-(mtp|cdp)(-overlay)?\.dt' \
                "$QCOM_MAKEFILE" || true
            else
              echo "[MISSING] $QCOM_MAKEFILE"
            fi

            echo
            echo "Kbuild target probes:"
            probe_target() {
              TARGET="$1"
              echo
              echo "---- $TARGET ----"
              make -C "$DTS_DIR" \
                ARCH=arm64 \
                LLVM=1 \
                LLVM_IAS=1 \
                -n "$TARGET" > /tmp/litomagnus-probe.txt 2>&1
              S=$?
              if [ "$S" -eq 0 ]; then
                echo "[REGISTERED] $TARGET"
                sed -n '1,8p' /tmp/litomagnus-probe.txt || true
              else
                echo "[NOT REGISTERED] $TARGET (probe exit $S)"
                tail -8 /tmp/litomagnus-probe.txt || true
              fi
            }

            probe_target "vendor/qcom/litomagnus-mtp.dtb"
            probe_target "vendor/qcom/litomagnus-mtp-overlay.dtbo"

            echo
            echo "Interpretation:"
            echo "- This audit does NOT modify DT sources."
            echo "- This audit does NOT disable WSA/audio."
            echo "- A missing Litomagnus standalone target is diagnostic only."
            echo "- The real kernel build in step 19 remains the authoritative"
            echo "  compile gate and will produce the actual compiler/DTC error"
            echo "  if the selected kernel configuration has a real DT problem."

          } >"$LOG" 2>&1

          cat "$LOG"
          exit 0

      # ============================================================
      - name: 18 - Pre-Build Sanity (Diagnostic Only)
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/18-prebuild-sanity.log"
          : > "$LOG"

          {
            echo "=========================================="
            echo "PRE-BUILD SANITY - DIAGNOSTIC ONLY"
            echo "=========================================="

            check() {
              NAME="$1"
              shift
              echo
              echo "[CHECK] $NAME"
              "$@"
              S=$?
              if [ "$S" -eq 0 ]; then
                echo "[PASS] $NAME"
              else
                echo "[WARN] $NAME FAILED (exit $S)"
              fi
              return 0
            }

            check "Kernel version" make kernelversion
            check "Clang" clang --version
            check "LLD" ld.lld --version
            check "Final .config" test -s .config
            check "KernelSU" grep -q '^CONFIG_KSU=y$' .config
            check "KPROBES" grep -q '^CONFIG_KPROBES=y$' .config
            check "KPROBE_EVENTS" grep -q '^CONFIG_KPROBE_EVENTS=y$' .config
            check "KSU_KPROBE_HOOKS" grep -q '^CONFIG_KSU_KPROBE_HOOKS=y$' .config
            check "SELinux" grep -q '^CONFIG_SECURITY_SELINUX=y$' .config
            check "Baseband Guard" grep -q '^CONFIG_BBG=y$' .config
            check "SELinux flask.h" test -s security/selinux/flask.h
            check "SELinux av_permissions.h" test -s security/selinux/av_permissions.h
            check "BBG source" test -f security/baseband-guard/baseband_guard.c
            check "BBG Makefile" test -f security/baseband-guard/Makefile

            echo
            echo "CONFIG:"
            grep -E '^CONFIG_(KSU|KPROBES|KPROBE_EVENTS|KSU_KPROBE_HOOKS|SECURITY|SECURITY_SELINUX|BBG|LSM)=' .config || true

            echo
            echo "This step intentionally returns SUCCESS."
          } >"$LOG" 2>&1

          tail -180 "$LOG" || true
          exit 0

      # ============================================================
      # 19. BUILD KERNEL
      #
      # Full V=1 output goes ONLY to kernel-build-full.log.
      # Therefore GitHub's "step truncated due to large size"
      # cannot happen from the build output.
      # ============================================================
      - name: 19 - Build Kernel (Full Log to Artifact)
        shell: bash
        run: |
          set +e

          FULL_LOG="$GITHUB_WORKSPACE/kernel-build-full.log"
          ERROR_LOG="$DIAG_DIR/19-build-errors.log"
          TAIL_LOG="$DIAG_DIR/19-build-tail.log"
          SUMMARY_LOG="$DIAG_DIR/19-build-summary.log"

          : > "$FULL_LOG"
          : > "$ERROR_LOG"
          : > "$TAIL_LOG"
          : > "$SUMMARY_LOG"

          export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
          export CROSS_COMPILE="$GCC64_DIR/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GCC32_DIR/bin/arm-linux-androideabi-"

          echo "=========================================="
          echo "STARTING FULL KERNEL BUILD"
          echo "Full V=1 stdout/stderr is redirected to kernel-build-full.log."
          echo "Only compact diagnostics are printed to the GitHub step log."
          echo "=========================================="

          echo "clang=$(command -v clang)"
          echo "ld.lld=$(command -v ld.lld)"
          clang --version | sed -n '1,2p'
          ld.lld --version | sed -n '1,2p'

          START=$(date +%s)

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            -j"$(nproc)" \
            V=1 \
            WERROR=0 \
            >"$FULL_LOG" 2>&1

          BUILD_STATUS=$?

          END=$(date +%s)
          ELAPSED=$((END-START))

          {
            echo "BUILD_STATUS=$BUILD_STATUS"
            echo "BUILD_TIME_SECONDS=$ELAPSED"
            echo "BUILD_TIME_HUMAN=$((ELAPSED/60))m $((ELAPSED%60))s"
            echo "BUILD_LOG_BYTES=$(wc -c < "$FULL_LOG")"
            echo "BUILD_LOG_LINES=$(wc -l < "$FULL_LOG")"
          } | tee "$SUMMARY_LOG"

          grep -nEi \
            'fatal error:|error:|undefined reference|undeclared|implicit declaration|invalid|unknown argument|unknown warning|No such file|No rule to make target|recipe for target|Error [0-9]+|make\[[0-9]+\]: \*\*\*' \
            "$FULL_LOG" \
            | tail -250 >"$ERROR_LOG" || true

          tail -300 "$FULL_LOG" >"$TAIL_LOG" || true

          echo
          echo "===== COMPACT BUILD ERROR SUMMARY ====="
          if [ -s "$ERROR_LOG" ]; then
            echo "Full compiler-error list is in artifact: ci-logs/19-build-errors.log"
            echo "Showing only the final 20 matching lines here to avoid GitHub log truncation:"
            tail -20 "$ERROR_LOG" || true
          else
            echo "No compiler-error pattern found."
          fi

          echo
          echo "===== LAST 40 BUILD LINES ====="
          echo "Full build tail is in artifact: ci-logs/19-build-tail.log"
          tail -40 "$FULL_LOG" || true

          if [ "$BUILD_STATUS" -eq 0 ]; then
            test -s arch/arm64/boot/Image
            echo "KERNEL BUILD SUCCESSFUL"
          else
            echo "KERNEL BUILD FAILED - FULL LOG SAVED AS ARTIFACT"
          fi

          exit "$BUILD_STATUS"

      # ============================================================
      # 20. FINAL CHECK - NON-FATAL
      # ============================================================
      - name: 20 - Final Configuration and Artifact Check
        if: always()
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/20-final-check.log"
          : > "$LOG"

          {
            echo "=========================================="
            echo "FINAL CHECK"
            echo "=========================================="

            echo "Final config:"
            grep -E '^CONFIG_(KSU|KPROBES|KPROBE_EVENTS|KSU_KPROBE_HOOKS|SECURITY|SECURITY_SELINUX|BBG|LSM)=' .config || true

            echo
            echo "SELinux headers:"
            ls -lh security/selinux/flask.h security/selinux/av_permissions.h 2>&1 || true

            echo
            echo "Kernel image:"
            ls -lh arch/arm64/boot/Image 2>&1 || true

            echo
            echo "Build logs:"
            ls -lh kernel-build-full.log "$DIAG_DIR"/19-build-*.log 2>&1 || true
          } >"$LOG" 2>&1

          cat "$LOG"
          exit 0

      # ============================================================
      # 21. DIAGNOSTIC SUMMARY
      # ============================================================
      - name: 21 - Generate Diagnostic Summary
        if: always()
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/21-diagnostic-summary.log"

          {
            echo "=========================================="
            echo "COMPLETE DIAGNOSTIC SUMMARY"
            echo "=========================================="
            echo "UTC: $(date -u)"
            echo "SHA: $GITHUB_SHA"
            echo "RUN: $GITHUB_RUN_ID"
            echo

            echo "===== ALL LOG FILES ====="
            find "$DIAG_DIR" -type f -printf '%p %s bytes\n' | sort

            echo
            echo "===== BUILD LOG STATUS ====="
            if [ -f kernel-build-full.log ]; then
              wc -l kernel-build-full.log
              wc -c kernel-build-full.log
            else
              echo "kernel-build-full.log is MISSING"
            fi

            echo
            echo "===== BUILD ERROR SUMMARY ====="
            if [ -s "$DIAG_DIR/19-build-errors.log" ]; then
              echo "Full error summary: ci-logs/19-build-errors.log"
              tail -30 "$DIAG_DIR/19-build-errors.log"
            else
              echo "No build error summary available."
            fi

            echo
            echo "===== IMAGE ====="
            ls -lh arch/arm64/boot/Image 2>&1 || true
          } >"$LOG" 2>&1

          cat "$LOG"
          exit 0

      # ============================================================
      # 22. FINAL FAILURE SNAPSHOT
      # ============================================================
      - name: 22 - Final Failure Snapshot
        if: always()
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/22-final-failure-snapshot.log"

          {
            echo "=========================================="
            echo "FINAL FAILURE SNAPSHOT"
            echo "=========================================="
            date -u
            echo

            echo "Disk:"
            df -h

            echo
            echo "Memory:"
            free -h

            echo
            echo "SELinux:"
            ls -lh security/selinux/flask.h security/selinux/av_permissions.h 2>&1 || true

            echo
            echo "Kernel image:"
            ls -lh arch/arm64/boot/Image 2>&1 || true

            echo
            echo "Last build errors (final 30 only; complete file is uploaded):"
            tail -30 "$DIAG_DIR/19-build-errors.log" 2>/dev/null || true

            echo
            echo "Last build lines (final 40 only; complete file is uploaded):"
            tail -40 "$DIAG_DIR/19-build-tail.log" 2>/dev/null || true
          } >"$LOG" 2>&1

          cat "$LOG"
          exit 0

      # ============================================================
      # 23. PACKAGE ANYKERNEL3
      # ============================================================
      - name: 23 - Package AnyKernel3
        if: success()
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/23-package-anykernel.log"
          : > "$LOG"

          {
            test -s arch/arm64/boot/Image

            rm -rf AnyKernel3
            git clone --depth=1 \
              https://github.com/KernelSU-Next/AnyKernel3.git \
              AnyKernel3

            cp arch/arm64/boot/Image AnyKernel3/
            cd AnyKernel3
            rm -rf .git

            zip -r9 \
              ../Ultimate-Kernel-LG-Velvet-KSU-Next-BBG.zip \
              . \
              -x "*.git*" \
              -x "README.md"

            cd ..
            mkdir -p output
            mv Ultimate-Kernel-LG-Velvet-KSU-Next-BBG.zip output/

            ls -lh output/
          } >"$LOG" 2>&1
          STATUS=$?

          tail -100 "$LOG" || true
          exit "$STATUS"

      # ============================================================
      # 24. STAGE COMPLETE DIAGNOSTICS
      # ============================================================
      - name: 24 - Stage Complete Diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p diagnostic-artifact

          cp -f kernel-build-full.log diagnostic-artifact/19-build-full.log 2>/dev/null || true
          cp -f .config diagnostic-artifact/final.config 2>/dev/null || true
          WORKFLOW_FILE=$(find .github/workflows -maxdepth 1 -type f \
            \( -name "*.yml" -o -name "*.yaml" \) 2>/dev/null | head -1)
          if [ -n "$WORKFLOW_FILE" ] && [ -f "$WORKFLOW_FILE" ]; then
            cp -f "$WORKFLOW_FILE" diagnostic-artifact/workflow-used.yml
          fi
          cp -rf "$DIAG_DIR" diagnostic-artifact/ci-logs 2>/dev/null || true

          {
            echo "GitHub Run: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Date: $(date -u)"
            echo
            find diagnostic-artifact -type f -printf '%p %s bytes\n' | sort
          } > diagnostic-artifact/MANIFEST.txt

          exit 0

      # ============================================================
      # 25. UPLOAD COMPLETE DIAGNOSTICS
      # ============================================================
      - name: 25 - Upload Complete Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LG-Velvet-Complete-Diagnostics
          path: diagnostic-artifact
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      # ============================================================
      # 26. UPLOAD KERNEL OUTPUT
      # ============================================================
      - name: 26 - Upload Kernel Output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LG-Velvet-Kernel-Image
          path: arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 27. UPLOAD FLASHABLE ZIP
      # ============================================================
      - name: 27 - Upload Flashable ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Kernel-LG-Velvet-KSU-Next-BBG
          path: output/Ultimate-Kernel-LG-Velvet-KSU-Next-BBG.zip
          if-no-files-found: error
          retention-days: 14
